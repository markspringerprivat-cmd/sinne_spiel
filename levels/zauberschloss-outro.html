<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abschlussgeschichte | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=94">
</head>
<body class="castle-outro-page">
  <main class="castle-outro-shell" aria-label="Abschlussgeschichte">
    <section class="castle-outro-stage">
      <div class="castle-outro-image-wrap">
        <img id="castleOutroImage" class="castle-outro-image" src="../assets/images/finale/out_1.png" alt="Abschlussbild 1" draggable="false">
      </div>
      <div class="castle-outro-text-card" aria-live="polite">
        <div class="story-progress">
          <span id="castleOutroCounter">1 / 6</span>
          <div class="story-progress-bar"><div id="castleOutroProgress" style="width:16.67%"></div></div>
        </div>
        <h2 id="castleOutroTitle" class="castle-outro-title">Die Kugel zerbricht</h2>
        <p id="castleOutroText" class="castle-outro-text"></p>
        <div class="castle-outro-actions">
          <button id="castleOutroNext" class="primary-button" type="button">Weiter</button>
          <a id="castleOutroFinish" class="primary-button hidden" href="../game.html?fromLevel=1">Zur Weltkarte</a>
        </div>
      </div>
    </section>
  </main>
  <script src="../assets/js/zauberschloss-outro.js?v=94"></script>
</body>
</html>
