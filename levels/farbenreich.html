<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Farbenreich | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="level-map-page">
  <audio id="levelMusic" src="../assets/audio/color.mp3" preload="auto"></audio>
  <main class="level-map-shell" aria-label="Farbenreich">
    <section class="level-map-stage" style="--level-w:1024;--level-h:1536;--start-x:20%;--start-y:82%;" aria-label="Levelkarte Farbenreich">
      <img class="level-bg-image" src="../assets/images/level-backgrounds/farbenreich.png" alt="Farbenreich Hintergrund" draggable="false">

      <button class="level-marker" style="--x:75%;--y:41%;--size:24%;" data-target-x="75" data-target-y="41" data-title="Farben-Minispiel" data-text="Hier startet später das Farben-Minispiel." aria-label="Farben-Minispiel betreten"></button>
      <button class="level-marker" style="--x:29%;--y:17%;--size:24%;" data-target-x="29" data-target-y="17" data-title="Quiz / Bossbereich" data-text="Hier folgt später das Quiz oder der zweite Levelteil." aria-label="Quiz / Bossbereich betreten" data-quiz-id="farbenreich"></button>

      <img id="levelKnight" class="level-knight" src="../assets/images/characters/knight.png" alt="Ritter" draggable="false">
    </section>
  </main>

  <a class="level-back-button" href="../game.html?fromLevel=1">Zurück</a>

  <div id="levelPopup" class="level-popup hidden" role="dialog" aria-modal="true" aria-labelledby="levelPopupTitle">
    <div class="level-popup-card">
      <h2 id="levelPopupTitle">Level</h2>
      <p id="levelPopupText">Inhalt folgt später.</p>
      <button id="levelPopupClose" class="primary-button" type="button">Weiter</button>
    </div>
  </div>

  <script src="../assets/js/audio-crossfade.js"></script>
  <script src="../assets/js/quiz-data.js"></script>
  <script src="../assets/js/level.js"></script>
</body>
</html>
