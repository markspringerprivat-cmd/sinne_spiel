<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zauberschloss | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="level-map-page">
  <audio id="levelMusic" src="../assets/audio/zauberschloss_new.mp3" preload="auto"></audio>
  <main class="level-map-shell" aria-label="Zauberschloss">
    <section class="level-map-stage" style="--level-w:941;--level-h:1672;--start-x:50%;--start-y:86%;" aria-label="Levelkarte Zauberschloss">
      <img class="level-bg-image" src="../assets/images/level-backgrounds/zauberschloss.png" alt="Zauberschloss Hintergrund" draggable="false">

      <button class="level-marker" style="--x:70%;--y:55%;--size:24%;" data-target-x="70" data-target-y="55" data-title="Magischer Prüfbereich" data-text="Hier startet später die Schlossprüfung." aria-label="Magischer Prüfbereich betreten"></button>
      <button class="level-marker" style="--x:50%;--y:18%;--size:24%;" data-target-x="50" data-target-y="18" data-title="Finaler Schlossbereich" data-text="Hier folgt später der finale Levelteil." aria-label="Finaler Schlossbereich betreten" data-quiz-id="zauberschloss"></button>

      <img id="levelKnight" class="level-knight" src="../assets/images/characters/knight.png" alt="Ritter" draggable="false">
    </section>
  </main>

  <a class="level-back-button" href="../game.html?fromLevel=1">Zurück</a>

  <div id="levelPopup" class="level-popup hidden" role="dialog" aria-modal="true" aria-labelledby="levelPopupTitle">
    <div class="level-popup-card">
      <h2 id="levelPopupTitle">Level</h2>
      <p id="levelPopupText">Inhalt folgt später.</p>
      <button id="levelPopupClose" class="primary-button" type="button">Weiter</button>
    </div>
  </div>

  <script src="../assets/js/audio-crossfade.js"></script>
  <script src="../assets/js/quiz-data.js"></script>
  <script src="../assets/js/level.js"></script>
</body>
</html>
