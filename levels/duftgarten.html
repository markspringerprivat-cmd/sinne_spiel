<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duftgarten | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="level-map-page">
  <audio id="levelMusic" src="../assets/audio/garden.mp3" preload="auto"></audio>
  <main class="level-map-shell" aria-label="Duftgarten">
    <section class="level-map-stage" style="--level-w:1024;--level-h:1536;--start-x:20%;--start-y:83%;" aria-label="Levelkarte Duftgarten">
      <img class="level-bg-image" src="../assets/images/level-backgrounds/duftgarten.png" alt="Duftgarten Hintergrund" draggable="false">

      <button class="level-marker" style="--x:73%;--y:46%;--size:24%;" data-target-x="73" data-target-y="46" data-title="Blütensprung" data-text="Springe als Ritter von Blume zu Blume und entkomme dem Käfer." data-minigame-url="duftgarten-sprung.html" aria-label="Blütensprung betreten"></button>
      <button class="level-marker" style="--x:27%;--y:18%;--size:24%;" data-target-x="27" data-target-y="18" data-title="Quiz / Bossbereich" data-text="Hier folgt später das Quiz oder der zweite Levelteil." aria-label="Quiz / Bossbereich betreten" data-quiz-id="duftgarten"></button>

      <img id="levelKnight" class="level-knight" src="../assets/images/characters/knight.png" alt="Ritter" draggable="false">
    </section>
  </main>

  <a class="level-back-button" href="../game.html?fromLevel=1">Zurück</a>

  <div id="levelPopup" class="level-popup hidden" role="dialog" aria-modal="true" aria-labelledby="levelPopupTitle">
    <div class="level-popup-card">
      <h2 id="levelPopupTitle">Level</h2>
      <p id="levelPopupText">Inhalt folgt später.</p>
      <button id="levelPopupClose" class="primary-button" type="button">Weiter</button>
    </div>
  </div>

  <script src="../assets/js/audio-crossfade.js"></script>
  <script src="../assets/js/quiz-data.js"></script>
  <script src="../assets/js/level.js"></script>
</body>
</html>
