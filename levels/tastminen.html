<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tastminen | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=89">
</head>
<body class="level-map-page">
  <audio id="levelMusic" src="../assets/audio/cave.mp3" preload="auto"></audio>
  <main class="level-map-shell" aria-label="Tastminen">
    <section class="level-map-stage" style="--level-w:1024;--level-h:1536;--start-x:19%;--start-y:82%;" aria-label="Levelkarte Tastminen">
      <img class="level-bg-image" src="../assets/images/level-backgrounds/tastminen.png" alt="Tastminen Hintergrund" draggable="false">

      <button class="level-marker" style="--x:77%;--y:49%;--size:24%;" data-target-x="77" data-target-y="49" data-title="Loren-Minispiel" data-text="Steige in die Mine ein und weiche den stacheligen Diamantformationen aus." data-minigame-url="tastminen-lore.html" aria-label="Loren-Minispiel betreten"></button>
      <button class="level-marker" style="--x:28%;--y:18%;--size:24%;" data-target-x="28" data-target-y="18" data-title="Quiz / Bossbereich" data-text="Hier folgt später das Quiz oder der zweite Levelteil." aria-label="Quiz / Bossbereich betreten" data-quiz-id="tastminen"></button>

      <img id="levelKnight" class="level-knight" src="../assets/images/characters/knight.png" alt="Ritter" draggable="false">
    </section>
  </main>

  <a class="level-back-button" href="../game.html?fromLevel=1">Zurück</a>

  <div id="levelPopup" class="level-popup hidden" role="dialog" aria-modal="true" aria-labelledby="levelPopupTitle">
    <div class="level-popup-card">
      <h2 id="levelPopupTitle">Level</h2>
      <div id="levelPopupText">Inhalt folgt später.</div>
      <button id="levelPopupClose" class="primary-button" type="button">Weiter</button>
    </div>
  </div>

  <script src="../assets/js/preloader.js"></script>
  <script src="../assets/js/audio-crossfade.js"></script>
  <script src="../assets/js/quiz-data.js"></script>
  <script src="../assets/js/level.js?v=90"></script>
</body>
</html>
