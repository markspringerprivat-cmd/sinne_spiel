<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tastminen | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body.level-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #7ad0ff 0, #2a6ca4 45%, #10243f 100%);
    }
    .level-card {
      width: min(620px, 100%);
      border-radius: 28px;
      padding: 30px 24px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
      text-align: center;
    }
    .level-card img {
      width: min(230px, 75vw);
      height: auto;
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.18));
    }
    .level-card h1 {
      font-size: clamp(2rem, 8vw, 3.4rem);
      margin-bottom: 10px;
    }
    .level-card p {
      font-size: 1.1rem;
      font-weight: 650;
      color: #3b4658;
    }
  </style>
</head>
<body class="level-page">
  <main class="level-card">
    <img src="../assets/images/regions/tastminen.png" alt="Tastminen">
    <h1>Tastminen</h1>
    <p>Inhalt folgt später.</p>
    <a class="primary-button" href="../game.html?fromLevel=1">Zurück zum Spielfeld</a>
  </main>
</body>
</html>
