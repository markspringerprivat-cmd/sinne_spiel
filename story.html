<!doctype html>
<html lang="de" class="sm-page-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vorgeschichte | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="assets/css/style.css?v=121">
</head>
<body class="story-page">
  <div id="globalPageLoader" class="global-page-loader" role="status" aria-live="polite" aria-label="Spiel wird geladen">
    <div class="global-page-loader-card">
      <div class="global-page-loader-icon" aria-hidden="true">✨</div>
      <div class="global-page-loader-title">Spiel wird vorbereitet …</div>
      <div class="global-page-loader-track"><div id="globalPageLoaderFill" class="global-page-loader-fill"></div></div>
      <div class="global-page-loader-meta">
        <span id="globalPageLoaderNote" class="global-page-loader-note">Benötigte Dateien werden geladen.</span>
        <span id="globalPageLoaderPercent" class="global-page-loader-percent">0 %</span>
      </div>
    </div>
  </div>
  <script src="assets/js/page-loader.js?v=107"></script>

  <audio id="storyAudio" src="assets/audio/intro_music.mp3" preload="metadata"></audio>
  <main class="story-shell">
    <section class="story-stage" aria-live="polite">
      <div class="story-image-wrap">
        <img id="storyImage" class="story-image is-visible" src="assets/images/story/panel-01.jpg" alt="Vorgeschichte Bild 1">
      </div>
      <div class="story-text-card">
        <div class="story-progress">
          <span id="storyCounter">1 / 14</span>
          <div class="story-progress-bar"><div id="storyProgressFill"></div></div>
        </div>
        <p id="storyText" class="story-text"></p>
        <div id="storyActions" class="story-actions hidden">
          <a class="primary-button" href="game.html">Abenteuer beginnen</a>
        </div>
      </div>
    </section>
  </main>

  <div id="storyModal" class="modal-backdrop hidden">
    <div class="modal-card story-start-card">
      <h2>Vorgeschichte</h2>
      <p>Die Geschichte dauert etwa 1 Minute und 15 Sekunden.</p>
      <div class="modal-actions">
        <button id="playStory" class="primary-button" type="button">Geschichte abspielen</button>
        <a class="ghost-button" href="game.html">Überspringen</a>
      </div>
    </div>
  </div>
  <script src="assets/js/story.js?v=116"></script>
  <script src="assets/js/cloud-save.js?v=116"></script>
  <script src="assets/js/score-system.js?v=116"></script>
</body>
</html>
