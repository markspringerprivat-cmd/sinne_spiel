<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spielfeld | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="game-page">
  <main class="overworld" aria-label="Interaktive Sinneskarte">
    <section class="map-stage" aria-label="Karte des Königreichs">
      <img class="map-image" src="assets/images/map/overworld.png" alt="Karte des Königreichs mit Sinnesgebieten" draggable="false">

      <div class="region-shade" data-lock-area="zauberschloss" style="--x:50%;--y:11%;--w:38%;--h:15%;"></div>
      <div class="region-shade" data-lock-area="farbenreich" style="--x:24%;--y:34%;--w:39%;--h:21%;"></div>
      <div class="region-shade" data-lock-area="klangwald" style="--x:76%;--y:35%;--w:36%;--h:21%;"></div>
      <div class="region-shade" data-lock-area="tastminen" style="--x:20%;--y:80%;--w:34%;--h:18%;"></div>
      <div class="region-shade" data-lock-area="duftgarten" style="--x:79%;--y:80%;--w:34%;--h:18%;"></div>
      <div class="region-shade" data-lock-area="flammenkueche" style="--x:51%;--y:91%;--w:44%;--h:15%;"></div>

      <button class="lock-button" data-lock-button="zauberschloss" data-area="zauberschloss" style="--x:50%;--y:11%;" aria-label="Zauberschloss ist gesperrt">🔒</button>
      <button class="lock-button" data-lock-button="farbenreich" data-area="farbenreich" style="--x:24%;--y:34%;" aria-label="Farbenreich ist gesperrt">🔒</button>
      <button class="lock-button" data-lock-button="klangwald" data-area="klangwald" style="--x:76%;--y:35%;" aria-label="Klangwald ist gesperrt">🔒</button>
      <button class="lock-button" data-lock-button="tastminen" data-area="tastminen" style="--x:20%;--y:80%;" aria-label="Tastminen sind gesperrt">🔒</button>
      <button class="lock-button" data-lock-button="duftgarten" data-area="duftgarten" style="--x:79%;--y:80%;" aria-label="Duftgarten ist gesperrt">🔒</button>
      <button class="lock-button" data-lock-button="flammenkueche" data-area="flammenkueche" style="--x:51%;--y:91%;" aria-label="Flammenküche ist gesperrt">🔒</button>

      <img id="knight" class="knight-sprite" src="assets/images/characters/knight.png" alt="Ritter" draggable="false">

      <button class="hotspot" style="--x:50%;--y:11%;--w:38%;--h:15%;" data-area="zauberschloss" data-name="Zauberschloss" data-target-x="50" data-target-y="16" aria-label="Zum Zauberschloss bewegen"></button>
      <button class="hotspot" style="--x:24%;--y:34%;--w:39%;--h:21%;" data-area="farbenreich" data-name="Farbenreich" data-target-x="24" data-target-y="38" aria-label="Zum Farbenreich bewegen"></button>
      <button class="hotspot" style="--x:76%;--y:35%;--w:36%;--h:21%;" data-area="klangwald" data-name="Klangwald" data-target-x="76" data-target-y="39" aria-label="Zum Klangwald bewegen"></button>
      <button class="hotspot" style="--x:50%;--y:57%;--w:38%;--h:19%;" data-area="koenigsschloss" data-name="Königsschloss" data-target-x="50" data-target-y="60" aria-label="Zum Königsschloss bewegen"></button>
      <button class="hotspot" style="--x:20%;--y:80%;--w:34%;--h:18%;" data-area="tastminen" data-name="Tastminen" data-target-x="20" data-target-y="83" aria-label="Zu den Tastminen bewegen"></button>
      <button class="hotspot" style="--x:79%;--y:80%;--w:34%;--h:18%;" data-area="duftgarten" data-name="Duftgarten" data-target-x="79" data-target-y="83" aria-label="Zum Duftgarten bewegen"></button>
      <button class="hotspot" style="--x:51%;--y:91%;--w:44%;--h:15%;" data-area="flammenkueche" data-name="Flammenküche" data-target-x="51" data-target-y="93" aria-label="Zur Flammenküche bewegen"></button>
    </section>

    <button id="settingsButton" class="settings-button" aria-label="Einstellungen öffnen">⚙️</button>
  </main>

  <div id="infoModal" class="game-modal hidden" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
    <div class="game-modal-card">
      <button class="modal-close" type="button" data-close-modal aria-label="Fenster schließen">×</button>
      <h2 id="infoModalTitle"></h2>
      <p id="infoModalText"></p>
    </div>
  </div>

  <div id="settingsModal" class="game-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="game-modal-card settings-card">
      <button class="modal-close" type="button" data-close-settings aria-label="Einstellungen schließen">×</button>
      <h2 id="settingsModalTitle">Einstellungen</h2>
      <div class="settings-empty" aria-label="Noch keine Einstellungen vorhanden"></div>
    </div>
  </div>

  <script src="assets/js/game.js"></script>
</body>
</html>
