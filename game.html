<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spielfeld | Die verlorene Sinnesmagie</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="game-page">
  <main class="overworld" aria-label="Interaktive Sinneskarte">
    <section class="map-stage" aria-label="Karte des Königreichs">
      <img class="map-image" src="assets/images/map/overworld.png" alt="Spielfeld mit Wiese, Hügel und verteilten Gebieten" draggable="false">

      <div class="region" data-region="zauberschloss" style="--x:50%;--y:11%;--size:33%;">
        <img class="region-image region-image-locked" src="assets/images/regions/zauberschloss_gesperrt.png" alt="Zauberschloss gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/zauberschloss.png" alt="Zauberschloss freigeschaltet" draggable="false">
        <button class="region-button" data-area="zauberschloss" data-name="Zauberschloss" data-target-x="50" data-target-y="15" aria-label="Zauberschloss ist gesperrt"></button>
      </div>

      <div class="region" data-region="farbenreich" style="--x:24%;--y:34%;--size:34%;">
        <img class="region-image region-image-locked" src="assets/images/regions/farbenreich_gesperrt.png" alt="Farbenreich gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/farbenreich.png" alt="Farbenreich freigeschaltet" draggable="false">
        <button class="region-button" data-area="farbenreich" data-name="Farbenreich" data-target-x="24" data-target-y="38" aria-label="Farbenreich ist gesperrt"></button>
      </div>

      <div class="region" data-region="klangwald" style="--x:76%;--y:34%;--size:34%;">
        <img class="region-image region-image-locked" src="assets/images/regions/klangwald_gesperrt.png" alt="Klangwald gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/klangwald.png" alt="Klangwald freigeschaltet" draggable="false">
        <button class="region-button" data-area="klangwald" data-name="Klangwald" data-target-x="76" data-target-y="38" aria-label="Klangwald ist gesperrt"></button>
      </div>

      <div class="region region-kingdom" data-region="koenigsschloss" style="--x:50%;--y:57%;--size:38%;">
        <img class="region-image region-image-locked" src="assets/images/regions/koenigsschloss_gesperrt.png" alt="Königsschloss gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/koenigsschloss.png" alt="Königsschloss freigeschaltet" draggable="false">
        <button class="region-button" data-area="koenigsschloss" data-name="Königsschloss" data-target-x="50" data-target-y="61" aria-label="Königsschloss betreten"></button>
      </div>

      <div class="region" data-region="tastminen" style="--x:18%;--y:79%;--size:31%;">
        <img class="region-image region-image-locked" src="assets/images/regions/tastminen_gesperrt.png" alt="Tastminen gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/tastminen.png" alt="Tastminen freigeschaltet" draggable="false">
        <button class="region-button" data-area="tastminen" data-name="Tastminen" data-target-x="18" data-target-y="82" aria-label="Tastminen sind gesperrt"></button>
      </div>

      <div class="region" data-region="duftgarten" style="--x:80%;--y:79%;--size:31%;">
        <img class="region-image region-image-locked" src="assets/images/regions/duftgarten_gesperrt.png" alt="Duftgarten gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/duftgarten.png" alt="Duftgarten freigeschaltet" draggable="false">
        <button class="region-button" data-area="duftgarten" data-name="Duftgarten" data-target-x="80" data-target-y="82" aria-label="Duftgarten ist gesperrt"></button>
      </div>

      <div class="region" data-region="flammenkueche" style="--x:50%;--y:90%;--size:31%;">
        <img class="region-image region-image-locked" src="assets/images/regions/flammenkueche_gesperrt.png" alt="Flammenküche gesperrt" draggable="false">
        <img class="region-image region-image-unlocked" src="assets/images/regions/flammenkueche.png" alt="Flammenküche freigeschaltet" draggable="false">
        <button class="region-button" data-area="flammenkueche" data-name="Flammenküche" data-target-x="50" data-target-y="93" aria-label="Flammenküche ist gesperrt"></button>
      </div>

      <img id="knight" class="knight-sprite" src="assets/images/characters/knight.png" alt="Ritter" draggable="false">
    </section>

    <button id="settingsButton" class="settings-button" aria-label="Einstellungen öffnen">⚙️</button>
  </main>

  <div id="infoModal" class="game-modal hidden" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
    <div class="game-modal-card">
      <button class="modal-close" type="button" data-close-modal aria-label="Fenster schließen">×</button>
      <div id="infoModalImageWrap" class="unlock-preview hidden">
        <img id="infoModalImage" class="unlock-preview-image" alt="Freigeschaltetes Gebiet" draggable="false">
      </div>
      <h2 id="infoModalTitle"></h2>
      <p id="infoModalText"></p>
    </div>
  </div>

  <div id="settingsModal" class="game-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="game-modal-card settings-card">
      <button class="modal-close" type="button" data-close-settings aria-label="Einstellungen schließen">×</button>
      <h2 id="settingsModalTitle">Einstellungen</h2>
      <div class="settings-empty" aria-label="Noch keine Einstellungen vorhanden"></div>
    </div>
  </div>

  <div id="scannerModal" class="game-modal hidden" role="dialog" aria-modal="true" aria-labelledby="scannerModalTitle">
    <div class="game-modal-card scanner-card">
      <button class="modal-close" type="button" data-close-scanner aria-label="Scanner schließen">×</button>
      <h2 id="scannerModalTitle">QR-Code scannen</h2>
      <p class="scanner-hint">Scanne hier am Königsschloss einen QR-Code, um ein Gebiet freizuschalten.</p>
      <div id="qr-reader" class="qr-reader"></div>
      <p id="scannerStatus" class="scanner-status">Kamera wird vorbereitet …</p>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
